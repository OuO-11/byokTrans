name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Custom Android Plugin
        run: |
          JAVA_DIR="android/app/src/main/java/com/byoktrans/app"
          mkdir -p "$JAVA_DIR"
          cp android-java/WebViewFetchPlugin.java "$JAVA_DIR/" || true
          cp android-java/MainActivity.java "$JAVA_DIR/" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find Debug APK Path
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byoktrans-app-debug
          path: ${{ env.APK_PATH }}
